events {}

http {
    server {
        listen 80;

        location /create_login {
            proxy_pass http://127.0.0.1:5000/create_login;
        }

        location /login {
            proxy_pass http://127.0.0.1:5000/login;
        }

        location /logout {
            proxy_pass http://127.0.0.1:5000/logout;
        }

        location / {
            return 200 "NGINX reverse proxy running\n";
        }
    }
}
