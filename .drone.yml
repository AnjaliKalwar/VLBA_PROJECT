kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

services:
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

steps:
  # -----------------------------
  # Check files
  # -----------------------------
  - name: check-required-files
    image: ubuntu:24.04
    commands:
      - test -f ./${DRONE_BRANCH}/exercise.md
      - test -f ./${DRONE_BRANCH}/exercise.var.md
      - test -f ./${DRONE_BRANCH}/solution.py
      - test -f ./${DRONE_BRANCH}/check.py

  # -----------------------------
  # Build FastAPI image
  # -----------------------------
  - name: build-fastapi
    image: docker:24
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t fastapi-app -f ${DRONE_BRANCH}/Dockerfile ${DRONE_BRANCH}

  # -----------------------------
  # Run FastAPI (Drone network)
  # -----------------------------
  - name: fastapi
    image: fastapi-app
    environment:
      DB1_HOST: db1
      DB2_HOST: db2
      DB_USER: app_user
      DB_PASS: app_password
      DB_NAME: login_db
    commands:
      - python solution.py

  # -----------------------------
  # Run NGINX (Drone network)
  # -----------------------------
  - name: nginx
    image: nginx:stable
    depends_on:
      - fastapi
    commands:
      - cp ${DRONE_BRANCH}/nginx/*.conf /etc/nginx/conf.d/
      - nginx -g "daemon off;"

  # -----------------------------
  # Run checks (Drone network)
  # -----------------------------
  - name: run-checks
    image: python:3.12-slim
    depends_on:
      - nginx
    environment:
      API_URL: http://nginx
    commands:
      - pip install requests mysql-connector-python
      - python ${DRONE_BRANCH}/check.py

trigger:
  branch:
    include:
      - feature*
