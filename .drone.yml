kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock

services:
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

steps:
  # -----------------------------
  # Check required files
  # -----------------------------
  - name: check-required-files
    image: ubuntu:24.04
    commands:
      - test -f ./${DRONE_BRANCH}/exercise.md
      - test -f ./${DRONE_BRANCH}/exercise.var.md
      - test -f ./${DRONE_BRANCH}/solution.py
      - test -f ./${DRONE_BRANCH}/check.py

  # -----------------------------
  # Build FastAPI image
  # -----------------------------
  - name: build-fastapi
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build --network=host -t fastapi-app -f ${DRONE_BRANCH}/Dockerfile ${DRONE_BRANCH}

  # -----------------------------
  # Run FastAPI
  # -----------------------------
  - name: run-fastapi
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker network create appnet || true
      - docker network connect appnet db1 || true
      - docker network connect appnet db2 || true
      - docker rm -f fastapi || true
      - |
        docker run -d \
          --name fastapi \
          --network appnet \
          -p 5000:5000 \
          -e DB1_HOST=db1 \
          -e DB2_HOST=db2 \
          -e DB_USER=app_user \
          -e DB_PASS=app_password \
          -e DB_NAME=login_db \
          fastapi-app
      - sleep 5
      - docker logs fastapi

  # -----------------------------
  # Run NGINX
  # -----------------------------
  - name: run-nginx
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    depends_on:
      - run-fastapi
    commands:
      - docker rm -f nginx || true
      - |
        docker run -d \
          --name nginx \
          --network appnet \
          -p 80:80 \
          -v /drone/src/${DRONE_BRANCH}/nginx:/etc/nginx/conf.d:ro \
          nginx:stable
      - sleep 3
      - docker logs nginx

  # -----------------------------
  # Run checks
  # -----------------------------
  - name: run-checks
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    depends_on:
      - run-nginx
    commands:
      - |
        docker run --rm \
          --network appnet \
          -e API_URL=http://nginx \
          -v /drone/src/${DRONE_BRANCH}:/app \
          -w /app \
          python:3.12-slim \
          sh -c "
            pip install requests mysql-connector-python &&
            python check.py
          "

trigger:
  branch:
    include:
      - feature*
