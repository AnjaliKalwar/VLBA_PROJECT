kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

# -----------------------------
# Services (Databases)
# -----------------------------
services:
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

# -----------------------------
# Pipeline Steps
# -----------------------------
steps:

  # - name: basic-info
  #   image: ubuntu:24.04
  #   commands:
  #     - echo "Repo URL: ${DRONE_GIT_HTTP_URL}"
  #     - echo "Branch: ${DRONE_BRANCH}"
  #     - ls
  #     - ls ./${DRONE_BRANCH}

  - name: check-required-files
    image: ubuntu:24.04
    commands:
      - test -f ./${DRONE_BRANCH}/exercise.md
      - test -f ./${DRONE_BRANCH}/exercise.var.md
      # - test -f ./${DRONE_BRANCH}/mydocs.md
      - test -f ./${DRONE_BRANCH}/solution.py
      - test -f ./${DRONE_BRANCH}/check.py

  

  # # -----------------------------
  # # FastAPI Application
  # # -----------------------------
  - name: build-fastapi
    image: docker:24
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t fastapi-app -f ${DRONE_BRANCH}/Dockerfile ${DRONE_BRANCH}

  - name: run-fastapi
    image: docker:24
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DB1_HOST: db1
      DB2_HOST: db2
      DB_USER: app_user
      DB_PASS: app_password
      DB_NAME: login_db
    commands:
      - docker run -d \
          --name fastapi \
          --network host \
          fastapi-app


  # -----------------------------
  # NGINX Reverse Proxy
  # -----------------------------
  - name: nginx
    image: nginx:stable
    depends_on:
      - fastapi
    commands:
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        events {}
        http {
            upstream fastapi_app {
                server fastapi:5000;
            }

            server {
                listen 80;

                location /create_login {
                    proxy_pass http://fastapi_app/create_login;
                }

                location /login {
                    proxy_pass http://fastapi_app/login;
                }

                location /logout {
                    proxy_pass http://fastapi_app/logout;
                }
            }
        }
        EOF
      - nginx
      - sleep 5

  # # -----------------------------
  # # Run Functional Checks
  # # -----------------------------
  # - name: run-checks
  #   image: python:3.12-slim
  #   environment:
  #     API_URL: http://nginx
  #   commands:
  #     - pip install requests
  #     - python ${DRONE_BRANCH}/check

# -----------------------------
# Trigger Rules
# -----------------------------
trigger:
  branch:
    include:
      - feature*
