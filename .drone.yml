kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

# -----------------------------
# Volumes
# -----------------------------
volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock

# -----------------------------
# Services (Databases)
# -----------------------------
services:
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

# -----------------------------
# Pipeline Steps
# -----------------------------
steps:

  # -----------------------------
  # Check required files
  # -----------------------------
  - name: check-required-files
    image: ubuntu:24.04
    commands:
      - "test -f ./${DRONE_BRANCH}/exercise.md"
      - "test -f ./${DRONE_BRANCH}/exercise.var.md"
      - "test -f ./${DRONE_BRANCH}/solution.py"
      - "test -f ./${DRONE_BRANCH}/check.py"

  # -----------------------------
  # Build FastAPI Image
  # -----------------------------
  - name: build-fastapi
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    depends_on:
      - check-required-files
    commands:
      - docker build --network=host -t fastapi-app -f ${DRONE_BRANCH}/Dockerfile ${DRONE_BRANCH}

  # -----------------------------
  # Run FastAPI Container
  # -----------------------------
  - name: run-fastapi
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    depends_on:
      - build-fastapi
    environment:
      DB1_HOST: db1
      DB2_HOST: db2
      DB_USER: app_user
      DB_PASS: app_password
      DB_NAME: login_db
    commands:
      - docker rm -f fastapi || true
      - docker run -d --name fastapi -e DB1_HOST=db1 -e DB2_HOST=db2 -e DB_USER=app_user -e DB_PASS=app_password -e DB_NAME=login_db fastapi-app
      - docker logs fastapi

  # -----------------------------
  # Run NGINX Container
  # -----------------------------
  - name: run-nginx
    image: docker:24
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    depends_on:
      - run-fastapi
    commands:
      - docker rm -f nginx || true
      - docker run -d --name nginx -p 80:80 -v $(pwd)/${DRONE_BRANCH}:/etc/nginx nginx:stable

# -----------------------------
# Trigger Rules
# -----------------------------
trigger:
  branch:
    include:
      - feature*
