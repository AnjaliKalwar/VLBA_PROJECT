kind: pipeline
type: docker
name: default

clone:
  skip_verify: true

# -----------------------------
# Detached Services (Servers)
# -----------------------------
services:

  # -------- Database 1 --------
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  # -------- Database 2 (Redundancy) --------
  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  # -------- FastAPI App --------
  - name: fastapi
    image: ubuntu:24.04
    environment:
      DB1_HOST: db1
      DB2_HOST: db2
      DB_USER: app_user
      DB_PASS: app_password
      DB_NAME: login_db
    commands:
      - apt-get update
      - apt-get install -y python3 python3-pip
      - pip3 install fastapi uvicorn mysql-connector-python
      - python3 ${DRONE_BRANCH}/solution.py

  # -------- NGINX Reverse Proxy --------
  - name: nginx
    image: nginx:stable
    commands:
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        events {}

        http {
            upstream fastapi_app {
                server fastapi:5000;
            }

            server {
                listen 80;

                location /create_login {
                    proxy_pass http://fastapi_app/create_login;
                }

                location /login {
                    proxy_pass http://fastapi_app/login;
                }

                location /logout {
                    proxy_pass http://fastapi_app/logout;
                }

                location / {
                    return 200 "NGINX reverse proxy running\n";
                }
            }
        }
        EOF
      - nginx -g 'daemon off;'

# -----------------------------
# Pipeline Steps
# -----------------------------
steps:

  - name: basic info
    image: ubuntu:24.04
    commands:
      - echo "Repo URL: ${DRONE_GIT_HTTP_URL}"
      - echo "Branch: ${DRONE_BRANCH}"
      - pwd
      - ls
      - ls ./${DRONE_BRANCH}

  - name: check required files
    image: ubuntu:24.04
    commands:
      - test -f ./${DRONE_BRANCH}/myexercise.md
      - test -f ./${DRONE_BRANCH}/myexercise.var.md
      - test -f ./${DRONE_BRANCH}/mydocs.md
      - test -f ./${DRONE_BRANCH}/solution.py
      - test -f ./${DRONE_BRANCH}/check

  - name: run checks via nginx
    image: python:3.12-slim
    environment:
      API_URL: http://nginx
    commands:
      - pip install requests
      - python ${DRONE_BRANCH}/check

# -----------------------------
# Trigger
# -----------------------------
trigger:
  branch:
    - feature*
