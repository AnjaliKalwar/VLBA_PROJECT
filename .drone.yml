kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

# -----------------------------
# Services (Databases)
# -----------------------------
services:
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

# -----------------------------
# Pipeline Steps
# -----------------------------
steps:

  - name: basic-info
    image: ubuntu:24.04
    commands:
      - echo "Repo URL: ${DRONE_GIT_HTTP_URL}"
      - echo "Branch: ${DRONE_BRANCH}"
      - ls
      - ls ./${DRONE_BRANCH}

  - name: check-required-files
    image: ubuntu:24.04
    commands:
      - test -f ./${DRONE_BRANCH}/myexercise.md
      - test -f ./${DRONE_BRANCH}/myexercise.var.md
      - test -f ./${DRONE_BRANCH}/mydocs.md
      - test -f ./${DRONE_BRANCH}/solution.py
      - test -f ./${DRONE_BRANCH}/check

