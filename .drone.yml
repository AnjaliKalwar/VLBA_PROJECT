kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock

steps:
  - name: setup-network-and-db
    image: docker:26
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker network inspect appnet >/dev/null 2>&1 || docker network create appnet
      - docker rm -f db1 db2 || true

      - |
        docker run -d --name db1 --network appnet \
          -e MYSQL_DATABASE=login_db \
          -e MYSQL_USER=app_user \
          -e MYSQL_PASSWORD=app_password \
          -e MYSQL_ROOT_PASSWORD=rootpassword \
          mysql:8.0

      - |
        docker run -d --name db2 --network appnet \
          -e MYSQL_DATABASE=login_db \
          -e MYSQL_USER=app_user \
          -e MYSQL_PASSWORD=app_password \
          -e MYSQL_ROOT_PASSWORD=rootpassword \
          mysql:8.0

      - sleep 20

  - name: build-fastapi
    image: docker:26
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t fastapi-app -f ${DRONE_BRANCH}/Dockerfile ${DRONE_BRANCH}

  - name: run-fastapi
    image: docker:26
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker rm -f fastapi || true
      - |
        docker run -d --name fastapi --network appnet \
          -e DB1_HOST=db1 \
          -e DB2_HOST=db2 \
          -e DB_USER=app_user \
          -e DB_PASS=app_password \
          -e DB_NAME=login_db \
          fastapi-app
      - sleep 5
      - docker logs fastapi

  - name: run-nginx
    image: docker:26
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker rm -f nginx || true
      - |
        docker run -d --name nginx \
          --network appnet \
          -p 80:80 \
          -v $(pwd)/${DRONE_BRANCH}/nginx:/etc/nginx/conf.d:ro \
          nginx:stable
      - sleep 3
      - docker logs nginx

  - name: run-checks
    image: python:3.12-slim
    environment:
      API_URL: http://localhost
    commands:
      - pip install requests mysql-connector-python
      - python ${DRONE_BRANCH}/check.py

trigger:
  branch:
    include:
      - feature*
