kind: pipeline
type: docker
name: default
  # Note: Use as long as the 'certificate has expired' error
  #       occurs. Also use it if the error suddenly happens during
  #       productive use after problem free operations
clone:
  skip_verify: true


steps:

- name: example - start changing here
  image: ubuntu:22.04
  commands:
  - echo 'this is your starting point and the files cloned to it'
  - echo '- - - - - - - - - - - - - - - - - - - - - - - - - - - '
  - echo ''
  - echo ${DRONE_GIT_HTTP_URL}
  - echo ${DRONE_BRANCH}
  - pwd
  - ls
  - ls ./${DRONE_BRANCH}

- name: check if all files are in place
  image: ubuntu:22.04
  commands:
    - test -f ./${DRONE_BRANCH}/myexercise.md
    - test -f ./${DRONE_BRANCH}/myexercise.var.md
    - test -f ./${DRONE_BRANCH}/mydocs.md
    - test -f ./${DRONE_BRANCH}/mysolution
    - test -f ./${DRONE_BRANCH}/mycheck

trigger:
  branch:
  - feature*