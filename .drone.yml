kind: pipeline
type: docker
name: login-logout-pipeline

clone:
  skip_verify: true

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock

services:
  - name: db1
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

  - name: db2
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: login_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: rootpassword

steps:
  - name: check-required-files
    image: ubuntu:24.04
    commands:
      - test -f ./${DRONE_BRANCH}/exercise.md
      - test -f ./${DRONE_BRANCH}/exercise.var.md
      - test -f ./${DRONE_BRANCH}/solution.py
      - test -f ./${DRONE_BRANCH}/check.py

  - name: build-fastapi
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t fastapi-app -f ${DRONE_BRANCH}/Dockerfile ${DRONE_BRANCH}

  - name: run-fastapi
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker rm -f fastapi || true
      - |
        docker run -d --name fastapi \
          --network host \
          -e DB1_HOST=db1 \
          -e DB2_HOST=db2 \
          -e DB_USER=app_user \
          -e DB_PASS=app_password \
          -e DB_NAME=login_db \
          fastapi-app
      - sleep 5
      - docker logs fastapi

  - name: run-nginx
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker rm -f nginx || true
      - |
        docker run -d --name nginx \
          --network host \
          -v $(pwd)/${DRONE_BRANCH}/nginx:/etc/nginx/conf.d:ro \
          nginx:stable
      - sleep 2
      - docker logs nginx

  - name: run-checks
    image: python:3.12-slim
    environment:
      API_URL: http://localhost
    commands:
      - pip install requests mysql-connector-python
      - python ${DRONE_BRANCH}/check.py

trigger:
  branch:
    include:
      - feature*
